name: consuming

on:
  workflow_dispatch:
    inputs:
      onlyId:
        description: "Sync only one pack id (example: canonization)"
        required: false
        default: ""
      tag:
        description: "Release tag to consume (required for now)"
        required: false
        default: ""
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types:
      - consuming-release

permissions:
  contents: write

concurrency:
  group: consuming
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check automater credentials
        id: creds
        shell: bash
        env:
          APP_ID: ${{ vars.APP_ID }}
          PEM: ${{ secrets.PRIVATE_KEY }}
          B64: ${{ secrets.PRIVATE_KEY_B64 }}
        run: |
          if [ -n "$APP_ID" ] && { [ -n "$PEM" ] || [ -n "$B64" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping consuming: APP_ID/private key are not configured."
          fi

      - name: Normalize GitHub App private key
        id: key
        if: steps.creds.outputs.configured == 'true'
        shell: pwsh
        env:
          PEM: ${{ secrets.PRIVATE_KEY }}
          B64: ${{ secrets.PRIVATE_KEY_B64 }}
        run: |
          $key = $env:PEM
          if ([string]::IsNullOrWhiteSpace($key) -and -not [string]::IsNullOrWhiteSpace($env:B64)) {
            $key = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:B64))
          }

          if ([string]::IsNullOrWhiteSpace($key)) {
            throw "PRIVATE_KEY is empty (and PRIVATE_KEY_B64 is empty)."
          }

          if ($key.StartsWith('"') -and $key.EndsWith('"')) { $key = $key.Trim('"') }
          if ($key.StartsWith("'") -and $key.EndsWith("'")) { $key = $key.Trim("'") }
          $key = $key.Trim()

          $key = $key.TrimStart([char]0xFEFF)

          $key = $key -replace "`r",""
          $key = $key -replace "\\r",""
          $key = $key -replace "\\n","`n"

          if ($key -notmatch "BEGIN (RSA )?PRIVATE KEY") {
            try {
              $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
              if ($decoded -match "BEGIN (RSA )?PRIVATE KEY") {
                $key = $decoded.Trim()
              }
            } catch {
            }
          }

          if ($key -notmatch "BEGIN (RSA )?PRIVATE KEY") {
            throw "Private key does not look like PEM or base64-encoded PEM."
          }

          $pemMatch = [regex]::Match(
            $key,
            "(?s)-----BEGIN (RSA )?PRIVATE KEY-----\\s*(?<body>[A-Za-z0-9+/=\\s]+)\\s*-----END (RSA )?PRIVATE KEY-----"
          )
          if ($pemMatch.Success) {
            $body = ($pemMatch.Groups["body"].Value -replace "\\s", "")
            $chunks = ($body -split "(.{1,64})" | Where-Object { $_ -ne "" })
            $key = @(
              $pemMatch.Value -replace "(?s)^.*?(-----BEGIN (RSA )?PRIVATE KEY-----).*$", '$1'
              $chunks
              $pemMatch.Value -replace "(?s)^.*?(-----END (RSA )?PRIVATE KEY-----).*$", '$1'
            ) -join "`n"
          }

          $path = Join-Path $env:RUNNER_TEMP "app-private-key.pem"
          Set-Content -Path $path -Value $key -Encoding utf8NoBOM -NoNewline
          & openssl pkey -in $path -noout | Out-Null

          $pkcs8Path = Join-Path $env:RUNNER_TEMP "app-private-key-pkcs8.pem"
          & openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in $path -out $pkcs8Path

          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Value "private-key<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Value (Get-Content -Raw -Path $pkcs8Path)
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Value "EOF"

      - name: Create GitHub App token (Automater)
        id: app
        if: steps.creds.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ steps.key.outputs.private-key }}

      - name: Checkout (with App token)
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Git safe.directory
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run consuming engine
        if: steps.creds.outputs.configured == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          CONSUMING_SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          CONSUMING_ONLY_ID: ${{ github.event.client_payload.onlyId || inputs.onlyId || '' }}
          CONSUMING_TAG: ${{ github.event.client_payload.tag || inputs.tag || '' }}
        run: |
          $engine = "./.consuming/consuming-engine.ps1"
          if (-not (Test-Path $engine)) {
            $engine = "./.consuming/consuming.ps1"
          }
          if (-not (Test-Path $engine)) {
            throw "Missing consuming engine in ./.consuming/"
          }
          & $engine
