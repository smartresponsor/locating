name: consuming

on:
  workflow_dispatch:
    inputs:
      onlyId:
        description: "Sync only one pack id (example: canonization)"
        required: false
        default: ""
      tag:
        description: "Release tag to consume (required for now)"
        required: false
        default: ""
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types:
      - consuming-release

permissions:
  contents: write

concurrency:
  group: consuming
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        id: key
        shell: pwsh
        env:
          PEM: ${{ secrets.PRIVATE_KEY }}
          B64: ${{ secrets.PRIVATE_KEY_B64 }}
        run: |
          $key = $env:PEM
          if ([string]::IsNullOrWhiteSpace($key) -and -not [string]::IsNullOrWhiteSpace($env:B64)) {
            $key = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:B64))
          }

          if ([string]::IsNullOrWhiteSpace($key)) {
            throw "PRIVATE_KEY is empty (and PRIVATE_KEY_B64 is empty)."
          }

          if ($key.StartsWith('"') -and $key.EndsWith('"')) { $key = $key.Trim('"') }
          $key = $key.Trim()

          # remove BOM if it sneaks in
          $key = $key.TrimStart([char]0xFEFF)

          # normalize newlines (handle both actual CR and escaped \r\n)
          $key = $key -replace "`r",""
          $key = $key -replace "\\r",""
          $key = $key -replace "\\n","`n"

          if ($key -notmatch "BEGIN (RSA )?PRIVATE KEY") {
            try {
              $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
              if ($decoded -match "BEGIN (RSA )?PRIVATE KEY") {
                $key = $decoded.Trim()
              }
            } catch {
              # fall through
            }
          }

          if ($key -notmatch "BEGIN (RSA )?PRIVATE KEY") {
            throw "Private key does not look like PEM or base64-encoded PEM."
          }

          # write key to file without BOM and validate via openssl (no leak)
          $path = Join-Path $env:RUNNER_TEMP "app-private-key.pem"
          Set-Content -Path $path -Value $key -Encoding utf8NoBOM -NoNewline
          & openssl pkey -in $path -noout | Out-Null

          # export as multiline output (BOM-free)
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Value "private-key<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Value (Get-Content -Raw -Path $path)
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Value "EOF"

      - name: Create GitHub App token (Automater)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ steps.key.outputs.private-key }}

      - name: Checkout (with App token)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Git safe.directory
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run consuming engine
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          CONSUMING_SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          CONSUMING_ONLY_ID: ${{ github.event.client_payload.onlyId || inputs.onlyId || '' }}
          CONSUMING_TAG: ${{ github.event.client_payload.tag || inputs.tag || '' }}
        run: |
          if (-not (Test-Path "./.consuming/consuming-engine.ps1")) {
            throw "Missing: ./.consuming/consuming-engine.ps1"
          }
          & "./.consuming/consuming-engine.ps1"