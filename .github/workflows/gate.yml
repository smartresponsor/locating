name: gate

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: owner-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run .gate check (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./.gate/check/run.sh

      - name: Run .gate check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path '.\.gate\check\run.ps1') {
            pwsh -File .\.gate\check\run.ps1
          } else {
            Write-Host 'No .gate check PowerShell runner found; skipping.'
          }

      - name: Gate fix proposal (print, Linux)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./.gate/contract/sh/fail-fixer-run.sh || true
          ./.gate/contract/sh/fail-fixer-run.sh . .report/gate-fix-proposal.ndjson print || true

      - name: Gate fix proposal (print, Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -File .\.gate\contract\ps1\fail-fixer-run.ps1 -RepoRoot . -PrintOnly
