name: Locator CI SLO Gate

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'config/**'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - 'phpstan.neon'
      - '.gate/**'
      - '.github/workflows/locator-ci-slo-gate.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'config/**'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - 'phpstan.neon'
      - '.gate/**'
      - '.github/workflows/locator-ci-slo-gate.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache composer + vendor
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-php82-slo-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php82-slo-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax lint
        shell: bash
        run: |
          mapfile -t files < <(find src tests tools public -type f -name '*.php' 2>/dev/null)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found for linting."
            exit 0
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache composer + vendor
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-php82-slo-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php82-slo-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: php vendor/bin/phpunit -c phpunit.xml.dist --testsuite locator-unit

  stan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache composer + vendor
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-php82-slo-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php82-slo-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: php vendor/bin/phpstan analyse -c phpstan.neon --no-progress

  smoke:
    runs-on: ubuntu-latest
    needs: [test, stan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache composer + vendor
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-php82-slo-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php82-slo-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run smoke tests
        run: php vendor/bin/phpunit -c phpunit.xml.dist --testsuite locator-smoke

      - name: Golden fixtures smoke
        env:
          LOCATOR_BASE_URL: http://localhost:8000
          LOCATOR_TENANT: demo
        run: |
          if [ -f tools/locator-fixtures-run.php ]; then
            php tools/locator-fixtures-run.php
          else
            echo "Fixture runner not found, skipping."
          fi

      - name: Run .gate check
        shell: bash
        run: bash ./.gate/check/run.sh
